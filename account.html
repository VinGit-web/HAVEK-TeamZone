</head>
<body>

    <h1>Account</h1>

    <header>
  <h1>Edit Profile</h1>
  <p>Update your account details and privacy preferences.</p>
</header>
 
<hr>
 
<main>
<form>
 
  <!-- ============================= -->
  <!--        PROFILE DETAILS        -->
  <!-- ============================= -->
  <fieldset>
    <legend><strong>Profile Details</strong></legend>
 
    <!-- Profile picture -->
    <p>
      <strong>Profile Picture</strong><br>
      <span id="avatarPreview">
        <svg viewBox="0 0 24 24" width="90" height="90">
          <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/>
        </svg>
      </span>
      <br>
      <input type="file" id="avatarInput" accept="image/*" hidden>
      <button type="button" onclick="document.getElementById('avatarInput').click()">Upload Photo</button>
      <button type="button" onclick="removeAvatar()">Remove</button>
    </p>
 
    <!-- Profile visibility -->
    <fieldset>
      <legend>Profile Visibility</legend>
      <label><input type="radio" name="visibility" value="public" checked> Public</label>
      <label><input type="radio" name="visibility" value="private"> Private</label>
    </fieldset>
 
    <!-- Basic info -->
    <p>
      <label for="username">Username</label><br>
      <input type="text" id="username" name="username" size="30" placeholder="Enter username">
    </p>
 
    <p>
      <label for="name">Full Name</label><br>
      <input type="text" id="name" name="name" size="30" placeholder="Enter full name">
    </p>
 
    <p>
      <label for="dob">Date of Birth</label><br>
      <input type="date" id="dob" name="dob">
    </p>
 
    <p>
      <label for="age">Age</label><br>
      <output id="age" name="age">--</output>
      <small>(calculated from date of birth)</small>
    </p>
 
    <p>
      <label for="gender">Gender</label><br>
      <select id="gender" name="gender">
        <option value="">Select gender</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="nonbinary">Non-binary</option>
        <option value="other">Other</option>
        <option value="prefer_not">Prefer not to say</option>
      </select>
    </p>
  </fieldset>
 
  <br>
 
  <!-- ============================= -->
  <!--   PRIVACY & USER SETTINGS     -->
  <!-- ============================= -->
  <fieldset>
    <legend><strong>Privacy &amp; User Settings</strong></legend>
 
    <h3>Privacy</h3>
    <ul>
      <li>
        <label>
          <input type="checkbox" id="show_email" name="show_email">
          Show email address on profile
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox" id="allow_messages" name="allow_messages" checked>
          Allow messages from other users
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox" id="search_visible" name="search_visible" checked>
          Show my profile in search results
        </label>
      </li>
    </ul>
 
    <h3>Account</h3>
    <ul>
      <li>
        <label>
          <input type="checkbox" id="email_notifications" name="email_notifications" checked>
          Email notifications
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox" id="two_factor" name="two_factor">
          Two-factor authentication
        </label>
      </li>
    </ul>
  </fieldset>
 
  <hr>
 
  <p>
    <button type="submit">Save Changes</button>
    <button type="reset">Cancel</button>
  </p>
 
</form>
</main>

  <script src="js/main.js"></script>  
</body>
</html>
