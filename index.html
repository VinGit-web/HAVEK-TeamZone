<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sphere</title>

    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <header class="site-header">

        <a href="index.html" class="site-logo">
            INTROSPHEER
        </a>

        <nav class="site-nav">
            <a href="index.html" class="active">Home</a>
            <a href="events.html">Events</a>
            <a href="strings.html">Strings</a>
            <a href="chat.html">Chat</a>
            <a href="account.html">Account</a>
            <a href="about.html">About</a>
        </nav>

    </header>


    <div class="sphere-toolbar">

        <div class="search-bar">

            <span class="search-icon">⌕</span>

            <input
                id="search"
                type="text"
                placeholder="Search people, events, or interests..."
            >

        </div>


        <button
            class="chat-shortcut"
            onclick="window.location.href='chat.html'"
        >
            Chats
        </button>


        <button
            class="account-shortcut"
            onclick="window.location.href='account.html'"
        >

            <div class="small-avatar">
                SS
            </div>

            <span>Samuel</span>

        </button>

    </div>

    <main class="sphere-page">

        <section id="scene">

            <div class="stars"></div>


            <div class="sphere-heading">

                <h1>My Sphere</h1>

                <div class="heading-line"></div>

                <p>
                    People you've met, people you'll meet,
                    and the experiences in between.
                </p>

            </div>


            <canvas id="canvas"></canvas>


            <div
                class="tooltip"
                id="tooltip"
            ></div>


            <div class="sphere-controls">

                Drag to rotate

                <span>•</span>

                Scroll to zoom

                <span>•</span>

                Click a profile

            </div>

        </section>

    </main>

    <aside
        class="profile-panel"
        id="profilePanel"
    >

        <button
            class="panel-close"
            id="panelClose"
        >
            ×
        </button>


        <div class="profile-header">

            <div
                class="profile-avatar"
                id="avatar"
            >
                ?
            </div>


            <div class="profile-name-area">

                <h2 id="pname">
                    Profile
                </h2>

                <p
                    class="profile-location"
                    id="ploc"
                ></p>

            </div>

        </div>


        <div class="profile-actions">

            <button
                class="message-button"
                id="msg"
            >
                Message
            </button>


            <button
                class="sphere-button"
                id="viewSphere"
            >
                View in Sphere
            </button>

        </div>


        <section class="profile-section">

            <h3>Interests</h3>

            <div
                class="interest-list"
                id="chips"
            ></div>

        </section>


        <section class="profile-section">

            <h3>About</h3>

            <p id="about"></p>

        </section>


        <section class="profile-section">

            <h3>Upcoming Events</h3>

            <div id="events"></div>

        </section>


        <section class="profile-section">

            <h3>Your Connection</h3>

            <p id="connection"></p>

        </section>

    </aside>

    <div
        class="chat-popup"
        id="chatbox"
    >

        <div class="chat-popup-header">

            <h3>Chats</h3>

            <button id="closeChat">
                ×
            </button>

        </div>


        <button
            class="chat-person"
            data-key="zach"
        >

            <div class="chat-avatar">
                ZT
            </div>

            <div>
                <strong>Zach</strong>

                <small>
                    Are you going to the event?
                </small>
            </div>

        </button>


        <button
            class="chat-person"
            data-key="mike"
        >

            <div class="chat-avatar">
                MS
            </div>

            <div>
                <strong>Mike</strong>

                <small>
                    Boxing event looks good.
                </small>
            </div>

        </button>


        <button
            class="chat-person"
            data-key="holly"
        >

            <div class="chat-avatar">
                HM
            </div>

            <div>
                <strong>Holly</strong>

                <small>
                    Museum this weekend?
                </small>
            </div>

        </button>

    </div>


    <script src="js/main.js"></script>

</body>
</html>
