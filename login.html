
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | INTROSPHEER</title>

    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-body">

    <main class="login-page">

        <a href="index.html" class="login-logo">
            <img src="images/logowhite.png" alt="INTROSPHEER Logo">
            <span>INTROSPHEER</span>
        </a>

        <section class="login-card">

            <div class="login-intro">
                <span class="login-eyebrow">WELCOME BACK</span>

                <h1>Log in to your Sphere.</h1>

                <p>
                    Your connections, conversations and upcoming events
                    are waiting for you.
                </p>
            </div>

            <form id="loginForm">

                <div class="login-field">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="login-field">
                    <div class="password-heading">
                        <label for="password">Password</label>
                    </div>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <p id="message" class="login-message" role="status" aria-live="polite"></p>

                <button type="submit" id="loginButton" class="login-submit">
                    Log In
                    <span aria-hidden="true">→</span>
                </button>

            </form>

            <div class="login-divider">
                <span>New to INTROSPHEER?</span>
            </div>

            <a href="register.html" class="register-link">
                Create an Account
            </a>

        </section>

        <p class="login-footer">
            Connect through shared interests. Meet through real experiences.
        </p>

    </main>

    <script type="module" src="js/login.js"></script>

</body>

</html>
